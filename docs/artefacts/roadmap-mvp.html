<!DOCTYPE html>
<!--
	roadmap-artefact.html: template consumed by `roadmap.py render`.
	Two placeholders, each substituted exactly once below: the phase-name
	title (in the head; the h1 is overwritten by JS from project/phase, since
	the two placeholders cannot diverge) and the JSON data blob
	(project, phase, generated, stats, ready, mermaid, validation, devColours,
	depKinds), which lands in the roadmap-data script element near the foot of
	the document. Render does a global string replace, so the data-blob token
	must appear verbatim exactly once in this file (the render step asserts
	this); a second copy here would inject the blob into this comment and the
	mermaid edge arrows would close the comment early and spill the JSON onto
	the page. For the same reason this comment must not contain a raw
	comment-close sequence.
	Everything else is static so regenerated artefacts diff cleanly.
	Palette: the canonical status/milestone-state/dev-chip colour table from
	library/references/roadmap-conventions.md (STATUS_STYLE in roadmap.py).
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roadmap — MVP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
	/* Palette: the roadmap system's own fixed status table (see roadmap.py
	   STATUS_STYLE); literal hexes so the artefact is self-contained.
	   Milestone — sky (structural, steel-blue half of the terminal gradient) */
	--color-milestone:       #007590;
	--color-milestone-bg:    #e3f7ff;
	--color-milestone-text:  #001f28;
	/* Primary accent — pink (warm half of the gradient; never a status) */
	--color-primary:         #d2008f;
	--color-primary-bg:      #fff7fb;
	--color-primary-text:    #4b0030;
	/* Status semantics: green finished, gray blank, red stop, purple parked,
	   cinnamon shelved, faded gray struck, yellow external */
	--color-done:            #008217;
	--color-done-bg:         #e0ffd9;
	--color-todo:            #6f6f6f;
	--color-todo-bg:         #f6f6f6;
	--color-blocked:         #e0002b;
	--color-blocked-bg:      #fff8f6;
	--color-paused:          #b01fe3;
	--color-paused-bg:       #fdf4ff;
	--color-deferred:        #ac5c00;
	--color-deferred-bg:     #fff8f3;
	--color-out-of-scope:    #8b8b8b;
	--color-out-of-scope-bg: #f6f6f6;
	--color-gate:            #7d6f00;
	--color-gate-bg:         #fff9e5;
	/* In progress (see roadmap-conventions.md): azure marks a claimed task
	   still in play and the milestone state it drives, the way milestone
	   states share their task-status hues. Distinct from sky (structural),
	   though close enough that diagram labels also carry a marker. */
	--color-in-progress:     #0071af;
	--color-in-progress-bg:  #e8f2ff;
	/* Dev-chip palette: assignee is free-text with no roster (never
	   inferred), so chips are coloured by a stable hash, never a hardcoded
	   name map. Disjoint from every status/milestone/gate hue above. */
	--color-dev-teal:        #007c6e;
	--color-dev-teal-bg:     #d7fff7;
	--color-dev-lime:        #677600;
	--color-dev-lime-bg:     #f7ffac;
	--color-dev-magenta:     #ca00b6;
	--color-dev-magenta-bg:  #fff3fc;
	--color-dev-indigo:      #0061fc;
	--color-dev-indigo-bg:   #f3f3ff;
	--color-dev-amber:       #926700;
	--color-dev-amber-bg:    #fff8ef;
	--color-dev-rose:        #db0072;
	--color-dev-rose-bg:     #fff7f9;

	--bg: #f6f6f6;
	--surface: #ffffff;
	--text: #222222;
	--muted: #6f6f6f;
	--line: #e2e2e2;
	--grid-line: rgba(0, 117, 144, 0.06);
	/* Mermaid chrome (edge stroke, arrowhead, edge-label backing) that the
	   diagram's own classDefs don't cover — see the render script below for
	   why this can't just be mermaid's base-theme default. */
	--diagram-line: #6f6f6f;
	--diagram-edge-label-bg: #ffffff;
	--diagram-text: var(--text);
}
@media (prefers-color-scheme: dark) {
	:root:not([data-theme="light"]) {
		--color-milestone:       #aee9ff;
		--color-milestone-bg:    #001f28;
		--color-milestone-text:  #e3f7ff;
		--color-primary:         #ffdcec;
		--color-primary-bg:      #4b0030;
		--color-primary-text:    #fff7fb;
		--color-done:            #72ff6c;
		--color-done-bg:         #062800;
		--color-todo:            #8b8b8b;
		--color-todo-bg:         #222222;
		--color-blocked:         #ffddd8;
		--color-blocked-bg:      #530003;
		--color-paused:          #f7d9ff;
		--color-paused-bg:       #3a004f;
		--color-deferred:        #ffdfc6;
		--color-deferred-bg:     #371d00;
		--color-out-of-scope:    #3e3e3e;
		--color-out-of-scope-bg: #222222;
		--color-gate:            #ffe53e;
		--color-gate-bg:         #292300;
		--color-in-progress:     #c6e0ff;
		--color-in-progress-bg:  #001c30;
		--color-dev-teal:        #00ffe4;
		--color-dev-teal-bg:     #002722;
		--color-dev-lime:        #d5f200;
		--color-dev-lime-bg:     #222600;
		--color-dev-magenta:     #ffd7f6;
		--color-dev-magenta-bg:  #44003c;
		--color-dev-indigo:      #deddff;
		--color-dev-indigo-bg:   #001649;
		--color-dev-amber:       #ffe0b2;
		--color-dev-amber-bg:    #302100;
		--color-dev-rose:        #ffdce5;
		--color-dev-rose-bg:     #4c0023;

		--bg: #121216;
		--surface: #1b1b21;
		--text: #f6f6f6;
		--muted: #8b8b8b;
		--line: #3e3e3e;
		--grid-line: rgba(174, 233, 255, 0.05);
		--diagram-line: #8b8b8b;
		--diagram-edge-label-bg: var(--surface);
		--diagram-text: var(--text);
	}
}
/* Third theming state: an explicit toggle wins in both directions, even
   against a light OS preference. The masthead ships the light/system/dark
   control from library/references/artefact-conventions.md; this block is
   what it writes to when a reader picks light or dark explicitly. */
:root[data-theme="dark"] {
	--color-milestone:       #aee9ff;
	--color-milestone-bg:    #001f28;
	--color-milestone-text:  #e3f7ff;
	--color-primary:         #ffdcec;
	--color-primary-bg:      #4b0030;
	--color-primary-text:    #fff7fb;
	--color-done:            #72ff6c;
	--color-done-bg:         #062800;
	--color-todo:            #8b8b8b;
	--color-todo-bg:         #222222;
	--color-blocked:         #ffddd8;
	--color-blocked-bg:      #530003;
	--color-paused:          #f7d9ff;
	--color-paused-bg:       #3a004f;
	--color-deferred:        #ffdfc6;
	--color-deferred-bg:     #371d00;
	--color-out-of-scope:    #3e3e3e;
	--color-out-of-scope-bg: #222222;
	--color-gate:            #ffe53e;
	--color-gate-bg:         #292300;
	--color-in-progress:     #c6e0ff;
	--color-in-progress-bg:  #001c30;
	--color-dev-teal:        #00ffe4;
	--color-dev-teal-bg:     #002722;
	--color-dev-lime:        #d5f200;
	--color-dev-lime-bg:     #222600;
	--color-dev-magenta:     #ffd7f6;
	--color-dev-magenta-bg:  #44003c;
	--color-dev-indigo:      #deddff;
	--color-dev-indigo-bg:   #001649;
	--color-dev-amber:       #ffe0b2;
	--color-dev-amber-bg:    #302100;
	--color-dev-rose:        #ffdce5;
	--color-dev-rose-bg:     #4c0023;

	--bg: #121216;
	--surface: #1b1b21;
	--text: #f6f6f6;
	--muted: #8b8b8b;
	--line: #3e3e3e;
	--grid-line: rgba(174, 233, 255, 0.05);
	--diagram-line: #8b8b8b;
	--diagram-edge-label-bg: var(--surface);
	--diagram-text: var(--text);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
	font-family: "IBM Plex Sans", system-ui, sans-serif;
	background:
		linear-gradient(var(--grid-line) 1px, transparent 1px),
		linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
		var(--bg);
	background-size: 32px 32px, 32px 32px, auto;
	color: var(--text);
	line-height: 1.55;
}
.layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 2rem; padding: 0 1.25rem; }
nav {
	position: sticky; top: 0; align-self: flex-start;
	width: 180px; flex-shrink: 0; padding: 2rem 0;
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem;
}
nav a { display: block; padding: 0.35rem 0.6rem; color: var(--muted); text-decoration: none; border-left: 2px solid var(--line); }
nav a:hover, nav a.active { color: var(--color-milestone); border-left-color: var(--color-milestone); }
main { flex: 1; min-width: 0; padding: 2rem 0 4rem; }

header.page { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
header.page h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 0.2rem; }
header.page .meta { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }

.theme-toggle { display: flex; gap: 0.15rem; margin-left: auto; flex: none; }
.theme-toggle button {
	font: 600 0.8rem "IBM Plex Mono", monospace; line-height: 1;
	color: var(--muted); background: var(--surface); border: 1px solid var(--line);
	border-radius: 3px; padding: 0.3rem 0.55rem; cursor: pointer;
}
.theme-toggle button:hover { color: var(--text); border-color: var(--color-milestone); }
.theme-toggle button:focus-visible { outline: 2px solid var(--color-milestone); outline-offset: 2px; }
.theme-toggle button[aria-pressed="true"] { color: var(--color-milestone-text); background: var(--color-milestone-bg); border-color: var(--color-milestone); }
@media print { .theme-toggle { display: none; } }

section { margin-top: 2.5rem; }
h2 {
	font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; font-weight: 500;
	text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
	display: flex; align-items: center; gap: 0.5rem; margin: 0 0 1rem;
}
h2 .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--color-milestone); flex-shrink: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 1.1rem 1.3rem; min-width: 0; }
.card--hero { background: var(--color-milestone-bg); border-color: var(--color-milestone); }
.card--hero .kpi { font-size: 2.1rem; font-weight: 600; color: var(--color-milestone-text); }
.card--hero .kpi small { font-size: 1rem; font-weight: 400; color: var(--color-milestone); margin-left: 0.5rem; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0.9rem; margin-top: 0.9rem; }
.grid > * { min-width: 0; }
.mini { border-color: var(--m-colour, var(--line)); }
.mini h3 { margin: 0 0 0.3rem; font-size: 0.9rem; font-weight: 600; overflow-wrap: break-word; }
.mini .count { font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); }
.progress-bar { height: 6px; background: var(--line); border-radius: 3px; margin-top: 0.55rem; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; }

details.milestone {
	background: var(--surface); border: 1px solid var(--m-colour, var(--line));
	border-radius: 8px; margin-bottom: 0.8rem;
}
details.milestone > summary {
	cursor: pointer; padding: 0.85rem 1.2rem; font-weight: 600;
	display: flex; align-items: center; gap: 0.7rem; list-style: none; min-width: 0;
}
details.milestone > summary::-webkit-details-marker { display: none; }
details.milestone > summary .mid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-milestone-bg); color: var(--color-milestone-text);
	border: 1px solid var(--color-milestone); border-radius: 4px; padding: 0.1rem 0.4rem;
}
details.milestone > summary .count { margin-left: auto; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
details.milestone .body { padding: 0 1.2rem 1rem; }
.group h4 { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; margin: 0.9rem 0 0.35rem; }
.group ul { list-style: none; margin: 0; padding: 0; }
.group li { padding: 0.28rem 0; overflow-wrap: break-word; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; }
.tid {
	font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
	background: var(--color-primary-bg); color: var(--color-primary-text);
	border: 1px solid var(--color-primary); border-radius: 4px; padding: 0.05rem 0.35rem;
}
/* Generic coloured chip: dev-assignee and dependency chips share this shape,
   coloured per-instance via the --chip-fg/--chip-bg custom properties so one
   rule serves every status/milestone/gate/dev colour without a class per
   colour. */
.chip {
	font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
	background: var(--chip-bg, var(--line)); color: var(--chip-fg, var(--muted));
	border: 1px solid var(--chip-fg, var(--line)); border-radius: 4px; padding: 0.05rem 0.4rem;
	white-space: nowrap;
}
.deps { display: inline-flex; flex-wrap: wrap; gap: 0.3rem; margin-left: auto; }
.tasktext { flex: 1 1 auto; }
.depnote { color: var(--muted); font-size: 0.82rem; }
li.oos { text-decoration: line-through; color: var(--muted); }

.diagram-shell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; position: relative; overflow: hidden; }
.diagram-toolbar { position: absolute; top: 0.5rem; right: 0.5rem; z-index: 2; display: flex; gap: 0.25rem; }
.diagram-toolbar button {
	font-family: "IBM Plex Mono", monospace; font-size: 0.8rem; line-height: 1;
	background: var(--bg); color: var(--text); border: 1px solid var(--line);
	border-radius: 4px; padding: 0.3rem 0.5rem; cursor: pointer;
}
.diagram-toolbar button:hover { border-color: var(--color-milestone); color: var(--color-milestone); }
.mermaid-wrap { overflow: hidden; cursor: grab; min-height: 320px; }
.mermaid-wrap:active { cursor: grabbing; }
.mermaid-wrap svg { display: block; transform-origin: 0 0; max-width: none !important; }
.diagram-shell.expanded { position: fixed; inset: 1.5rem; z-index: 10; box-shadow: 0 4px 40px rgba(0,0,0,0.35); }
.diagram-shell.expanded .mermaid-wrap { height: calc(100% - 0px); }

.legend {
	display: flex; flex-wrap: wrap; gap: 0.35rem 1.1rem; align-items: center;
	margin-top: 0.6rem; font-size: 0.78rem; color: var(--muted);
	font-family: "IBM Plex Mono", monospace;
}
.legend .key { display: inline-flex; align-items: center; gap: 0.4rem; }
.legend .sw { width: 0.9rem; height: 0.9rem; border-radius: 3px; border: 1.5px solid; box-sizing: border-box; }
.legend .key--mile { font-weight: 600; }
.legend .key--gate { font-style: italic; }
.legend .keynote { flex-basis: 100%; }

.nextup li:not(.nextup-devgroup) { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem; padding: 0.3rem 0; }
/* li.nextup-devgroup, not .nextup-devgroup: .group li (display:flex) would
   otherwise outrank it and lay a heading out beside its own list */
.nextup li.nextup-devgroup { display: block; padding: 0; margin-top: 1rem; }
.nextup li.nextup-devgroup:first-child { margin-top: 0; }
.nextup-devgroup h4 { margin: 0 0 0.4rem; font-size: 0.72rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.signal { color: var(--muted); font-size: 0.78rem; font-family: "IBM Plex Mono", monospace; margin-left: auto; }

.validation { border-left: 3px solid var(--color-blocked); background: var(--color-blocked-bg); color: var(--text); padding: 0.7rem 1rem; border-radius: 0 6px 6px 0; margin-top: 1rem; font-size: 0.85rem; }
.validation ul { margin: 0.3rem 0 0; padding-left: 1.1rem; }

@media (max-width: 760px) {
	.layout { flex-direction: column; gap: 0; }
	nav { position: sticky; top: 0; width: auto; display: flex; overflow-x: auto; gap: 0.25rem; padding: 0.6rem 0; background: var(--bg); z-index: 5; }
	nav a { border-left: none; border-bottom: 2px solid var(--line); white-space: nowrap; }
	nav a:hover, nav a.active { border-bottom-color: var(--color-milestone); }
}
</style>
</head>
<body>
<script>
(function () {
	var KEY = 'theme';
	var root = document.documentElement;
	function read() {
		try { return localStorage.getItem(KEY) || 'system'; }
		catch (e) { return 'system'; }
	}
	function write(mode) {
		try { localStorage.setItem(KEY, mode); }
		catch (e) { /* private window, blocked storage, preview capture: ignore */ }
	}
	function apply(mode) {
		if (mode === 'system') root.removeAttribute('data-theme');
		else root.setAttribute('data-theme', mode);
		document.querySelectorAll('[data-set-theme]').forEach(function (b) {
			b.setAttribute('aria-pressed', String(b.dataset.setTheme === mode));
		});
	}
	apply(read());
	document.addEventListener('DOMContentLoaded', function () {
		apply(read());
		document.querySelectorAll('[data-set-theme]').forEach(function (b) {
			b.addEventListener('click', function () {
				write(b.dataset.setTheme);
				apply(b.dataset.setTheme);
			});
		});
	});
})();
</script>
<div class="layout">
	<nav>
		<a href="#overview">Overview</a>
		<a href="#milestones">Milestones</a>
		<a href="#graph">Dependency Graph</a>
		<a href="#nextup">Next Up</a>
	</nav>
	<main>
		<header class="page">
			<div>
				<h1 id="pageTitle">MVP</h1>
				<div class="meta" id="meta"></div>
			</div>
			<div class="theme-toggle" role="group" aria-label="Colour theme">
				<button type="button" data-set-theme="light"  aria-pressed="false">☀</button>
				<button type="button" data-set-theme="system" aria-pressed="true">◐</button>
				<button type="button" data-set-theme="dark"   aria-pressed="false">☾</button>
			</div>
		</header>
		<div id="validation"></div>

		<section id="overview">
			<h2><span class="dot"></span>Overview</h2>
			<div class="card card--hero"><div class="kpi" id="hero"></div></div>
			<div class="grid" id="milestone-cards"></div>
		</section>

		<section id="milestones">
			<h2><span class="dot"></span>Milestones</h2>
			<div id="milestone-details"></div>
		</section>

		<section id="graph">
			<h2><span class="dot"></span>Dependency Graph</h2>
			<div class="diagram-shell" id="shell">
				<div class="diagram-toolbar">
					<button data-act="in" title="Zoom in">+</button>
					<button data-act="out" title="Zoom out">−</button>
					<button data-act="reset" title="Reset">⌂</button>
					<button data-act="expand" title="Expand">⤢</button>
				</div>
				<div class="mermaid-wrap" id="wrap"><div id="diagram"></div></div>
			</div>
			<div class="legend">
				<span class="key"><i class="sw" style="background:var(--color-todo-bg);border-color:var(--color-todo)"></i>todo</span>
				<span class="key"><i class="sw" style="background:var(--color-in-progress-bg);border-color:var(--color-in-progress)"></i>in progress ▸</span>
				<span class="key"><i class="sw" style="background:var(--color-blocked-bg);border-color:var(--color-blocked);border-width:2px"></i>blocked</span>
				<span class="key"><i class="sw" style="background:var(--color-paused-bg);border-color:var(--color-paused);border-style:dashed"></i>paused</span>
				<span class="key"><i class="sw" style="background:var(--color-deferred-bg);border-color:var(--color-deferred);border-style:dashed"></i>deferred</span>
				<span class="key"><i class="sw" style="background:var(--color-out-of-scope-bg);border-color:var(--color-out-of-scope);border-style:dotted"></i>out of scope</span>
				<span class="key key--mile"><i class="sw" style="background:var(--color-milestone-bg);border-color:var(--color-milestone)"></i>milestone</span>
				<span class="key key--gate"><i class="sw" style="background:var(--color-gate-bg);border-color:var(--color-gate);border-style:dashed"></i>external gate</span>
				<span class="keynote">tasks flow into the milestone node that they complete; done tasks and fully-done milestones are hidden</span>
			</div>
		</section>

		<section id="nextup">
			<h2><span class="dot"></span>Next Up</h2>
			<div class="card"><ul class="nextup group" id="ready" style="list-style:none;margin:0;padding:0"></ul></div>
		</section>

d (an enriched archived flag removes the repo from the site), each with a documented default", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.11", "5DR.23"], "milestone": "M7", "notes": "Two policy switches the lifecycle work makes meaningful. publishOnSync defaults to true (today's behaviour: every non-excluded manifest slug is on the site, index.ts:313); false turns drift approve (11LC.11) into a publication gate by filtering the registry to approved-or-authored slugs, which is why this waits on the approve verb. hideArchived reads the enriched section's archived flag (5DR.22) and waits on 5DR.23, which decides how archived reaches the site's retired axis; the switch chooses between shading (retired) and removal (hidden). First decision of the task: drift.config.ts is gitignored and per-machine (.gitignore:30), so a policy that changes what the site renders cannot live there or the Vercel build would silently fall back to the default. Policy needs a committed home both the CLI and index.ts read (a drift.policy.json beside sources.json, or a policy section in an existing committed data file), distinct from machine config.", "assignee": "", "started": ""}, {"id": "7DR.11", "description": "Redundancy report: surface authored values that match the current inference (track, contribution.role) as a drift report warning with a one-step delete, replacing the test-suite assertion", "status": "blocked", "display": "blocked", "dependsOn": ["7DR.1"], "milestone": "M7", "notes": "Two assertions in data.test.ts (removed in 780a817) failed CI whenever a sync moved inferTrack or the role heuristic onto an authored value; three repos crossing the product line-count threshold did exactly that. Agreement between an authored value and a heuristic is content state, not a code invariant, so it belongs in report output: cogni.track = product matches the inference, delete to render as provisional or keep to pin it. 7DR.1's resolver is what answers agrees or disagrees per field, so this waits on it; the resolver's own tests cover the logic against fixtures rather than the live manifest. Keep the rationale the tests carried: trackAuthored drives the dotted-provisional convention, so a redundant authored value silently upgrades a guess into a claim.", "assignee": "", "started": ""}, {"id": "8DE.1", "description": "Spike: investigate enhancements to the procedural OG card generation, and record the options with a recommendation", "status": "todo", "display": "todo", "dependsOn": ["4QU.4"], "milestone": "M8", "notes": "Supersedes the parked \"Generative OG variants per theme\" idea, which was one avenue among several. src/lib/og/card.ts derives each card from project data, but keys its motif on runtime alone via runtimeArchetype(), so 23 of 33 projects collapse into two archetypes (bun 12, node 11) and 5 fall through to the generic dot. Avenues to weigh: widening the archetype signal beyond runtime; theme-driven variants (themes currently feed nothing in card.ts); using signal the card already receives and ignores (kind, track, role, tags, lineage); and the motif mechanics themselves (one fixed 132px tiling, hash-seeded rotation and phase). Output is a written comparison with a recommendation, not an implementation; follow-up tasks land after it is read.", "assignee": "", "started": ""}, {"id": "5DR.23", "description": "Derive the site's retired and deployed axes from enriched manifest data, replacing the authored placeholders", "status": "todo", "display": "todo", "dependsOn": ["5DR.22"], "milestone": "M8", "notes": "", "assignee": "", "started": ""}, {"id": "5DR.27", "description": "Use the intra-span activity metrics in the timeline and/or graph visuals so a sparse multi-year project no longer renders identically to one sustained continuously", "status": "todo", "display": "todo", "dependsOn": ["5DR.25"], "milestone": "M8", "notes": "spanMonthsActive, spanMonthsAll and spanGapMaxDays reached Project.metrics via 5DR.25 as raw counts, deliberately without a display rule. The timeline's rail currently runs solid from commitAnyRoot to commitAnyLast regardless of how work was distributed across the span (src/routes/timeline/+page.ts, TimelineChart.svelte / timeline-layout.ts), so a repo touched three times across three years reads identically to one worked continuously for six months. What today's persisted data supports: rail density or opacity keyed to the active/total relationship, and a marker or break at spanGapMaxDays. What it does not: positioning individual active months along the rail; check-drift.js:595 computes the month-bucket Set and keeps only its .size, discarding which months were active. A true histogram needs the engine to persist the bucket array (a SyncedSource schema change plus a full re-sync of all 33 repos); flag as a possible prerequisite engine sub-task rather than assuming it's needed. Design caveat: active/total is confounded by project age, and those-who-came-before has the most active months of any project (15) yet reads as the least sustained by ratio, purely for having run three years instead of six months. Any visual should treat span as an axis, not reduce it to a percentage. Touches timeline-layout.ts's determinism discipline (byte-stable output, no Date()/Intl/Math.random) and its existing test suite.", "assignee": "Jason", "started": ""}, {"id": "5DR.29", "description": "Spike whether sync+enrich should be chainable into a single onboarding step: a drift onboard-style verb, a documented shell one-liner, or docs-only guidance; drift enrich only ever sees slugs already registered in sources.json's sources section (the same registered-only scope as drift sync's own backfill), so a brand-new project needs a sync first before enrich can see it at all, and that second step is easy to forget", "status": "blocked", "display": "blocked", "dependsOn": ["M5", "M6", "M7", "M10", "M11"], "milestone": "M9", "notes": "", "assignee": "", "started": ""}, {"id": "10EX.1", "description": "Spike: decide the extraction shape for the 8 portfolio-shaped verbs (author, flag, tag, relate project, tech, relate tech, theme, audit) — a core+portfolio-adapter package split, or generalising them behind a host-declared overlay schema contract", "status": "todo", "display": "todo", "dependsOn": [], "milestone": "M10", "notes": "M5 gate demoted from hard to soft: M5's only open task (5DR.28, parallelise gh repo view calls) has no bearing on extraction. The 'after decoupling settles' intent is real but not an artefact dependency, so it's recorded here rather than blocking the spike. Decided in the roadmap-review session that scoped M10 against M7.", "assignee": "", "started": ""}, {"id": "10EX.2", "description": "Inject repoRoot instead of deriving it from the engine's own script location, so a package consumer's host repo resolves correctly", "status": "blocked", "display": "blocked", "dependsOn": ["10EX.1", "5DR.8"], "milestone": "M10", "notes": "scripts/drift-config.js:31, resolve(scriptDir, '..') — installed at node_modules/drift/scripts/ this currently resolves to the package directory, not the host repo. DRIFT_CONFIG (drift-config.js:209) resolves relative to repoRoot too, so it is not an escape hatch. Gated on 5DR.8 (engine test suite: config resolution) because this refactors config resolution without a test suite covering config resolution otherwise.", "assignee": "", "started": ""}, {"id": "10EX.3", "description": "Add config.paths entries for tech-relationships.ts, tech-overlays.ts and themes.ts, currently derived as undeclared siblings of projectsDir", "status": "blocked", "display": "blocked", "dependsOn": ["10EX.1"], "milestone": "M10", "notes": "check-drift.js:111-115. A comment there already admits these three have no dedicated config.paths entry.", "assignee": "", "started": ""}, {"id": "10EX.4", "description": "Stop the engine emitting `import type { AuthoredProject } from '../types.js'` into scaffolded overlays; replace with whatever type contract the spike (10EX.1) settles on", "status": "blocked", "display": "blocked", "dependsOn": ["10EX.1"], "milestone": "M10", "notes": "check-drift.js:3603. The engine generates source code typed by a module the boundary doc's own ownership table assigns to the integration layer.", "assignee": "", "started": ""}, {"id": "10EX.5", "description": "Declare typescript and prettier as real package dependencies; degrade gracefully when gum is absent rather than failing the interactive surface outright", "status": "blocked", "display": "blocked", "dependsOn": ["10EX.1"], "milestone": "M10", "notes": "gum has 108 references in check-drift.js. drift audit also relies on Bun's native ESM loader, worth documenting as a runtime prerequisite alongside this.", "assignee": "", "started": ""}, {"id": "10EX.6", "description": "Correct docs/drift-boundary.md's claim that the engine \"can in principle be extracted into a standalone package\"; replace with the honest blocker list as the extraction spec", "status": "blocked", "display": "blocked", "dependsOn": ["10EX.1"], "milestone": "M10", "notes": "Boundary doc line 270. Verified false on three counts: repoRoot (10EX.2), the three unconfigured .ts paths (10EX.3), and the emitted AuthoredProject import (10EX.4). Raised in the roadmap-review session that scoped M5 against the decoupling question.", "assignee": "", "started": ""}, {"id": "11LC.1", "description": "Project lifecycle resolver: classify every repo Drift can see into exactly one state (discovered, ignored, registered, companion, synced-only, approved, authored, hidden) from the scan, sources.local.json, source-topology.json, sources.json, approved.json, projects/ and excluded.json", "status": "todo", "display": "todo", "dependsOn": [], "milestone": "M11", "notes": "Today the CLI answers \"what state is this repo in\" from six places that nothing reconciles: the scan under scanRoot (check-drift.js:2069-2105), sources.local.json, source-topology.json, sources.json, the projects/ directory and excluded.json; approved.json (11LC.11) makes seven. Precedence to settle and test: hidden beats authored (kamino has an overlay and sits in excluded.json); authored beats approved (an overlay supersedes a standing approval); a companion source is never a project (beacons-frontend-v2, craft-and-graft-api and sakura-front are registered today yet correctly absent from the site). Two per-machine overlays sit on top of any manifest state rather than being states themselves: broken path (configured in sources.local.json, not found on disk) and not on this machine (no path configured); 11LC.12 gives each its own report heading. Engine-side and framework-agnostic: it reads JSON and a directory listing only, so it stays in the portable core.", "assignee": "", "started": ""}, {"id": "11LC.2", "description": "drift register verb: add a discovered repo to sources.local.json by path or folder name, with --as \u003cslug\u003e and --companion-of \u003cslug\u003e, from the CLI and the menu", "status": "todo", "display": "todo", "dependsOn": [], "milestone": "M11", "notes": "Urgent: the working assumption so far was that drift report --full registers new repos; it never has. The report only lists discovered repos (filteredNew, check-drift.js:2105), and no verb writes sources.local.json after drift init, so every repo added since the manifest was seeded got there by hand edit. Pulled off the resolver dependency so it can ship now: the collision check it needs (slug already in sources.json, source-topology.json or sources.local.json) is three lookups, not the full classifier. The slug derives from the folder name through the same normalisation the scan uses (lowercase, underscores and spaces to hyphens), overridable with --as; --companion-of \u003cslug\u003e records the source under an existing project in source-topology.json instead of creating a new slug. Add the verb to the write-isolation contract in docs/drift-boundary.md and to the menu (Reconcile section, beside Sync). Register without 11LC.3 still leaves the repo off the site; the two ship back to back.", "assignee": "", "started": ""}, {"id": "11LC.3", "description": "drift sync admits registered slugs: fingerprint every primary source in sources.local.json, not only slugs already in sources.json, so a registered repo enters the manifest and the site on the next sync", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.2"], "milestone": "M11", "notes": "computeDrift iterates Object.entries(manifest.sources) (check-drift.js:1869), so a slug present in sources.local.json but absent from sources.json is never fingerprinted, and drift sync \u003cslug\u003e reports it as not resolvable. docs/drift-authoring.md (\"Adding a new project, end to end\", step 1) says sync picks a registered repo up; it does not, and that sentence needs correcting when this lands. Depends on 11LC.2 rather than the resolver: \"registered and awaiting admission\" is one set difference (sources.local.json primaries minus manifest slugs minus topology companions). Admission is publication under today's default: index.ts puts every non-excluded manifest slug on the site, so the confirm prompt must say so (\"admits N registered repos to the site\"); 7DR.10's publishOnSync switch is what would later change that. Decide and record whether --check treats a registered-but-unsynced repo as drift (recommended: yes, it is exactly the state the gate exists to catch).", "assignee": "", "started": ""}, {"id": "11LC.4", "description": "drift projects list verb: every repo Drift can see, one row per repo, grouped by lifecycle state, with --state filter and --json", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.1"], "milestone": "M11", "notes": "One row per repo, grouped by lifecycle state, --state \u003cstate\u003e to filter and --json for scripts. The registered group is acceptance scenario 2 (registered, neither hidden nor on the site); synced-only is scenario 4's population, with approved (11LC.11) beside it as the reviewed counterpart. drift new (5DR.30) becomes the discovered-state filter of this list once both exist, hence the soft edge. 7DR.7 later adds the track, role, tier and kind facets on top of the state grouping, which is why it now depends on this task.", "assignee": "", "started": ""}, {"id": "11LC.5", "description": "Lifecycle summary in the default report and menu: counts per state, each naming the exact next command (register, sync, author or hide)", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.2", "11LC.3", "11LC.4"], "milestone": "M11", "notes": "Replaces the report's bare \"New repos not yet in portfolio\" list. Each state line names the command that moves a repo forward, the same pattern as the drift keep line the override-drift flag already prints. Extend buildCoverageStats (check-drift.js:2343) so the coverage line counts registered-awaiting-sync alongside excluded and manifest-only.", "assignee": "", "started": ""}, {"id": "11LC.6", "description": "drift ignore verb: dismiss a discovered repo at scan level by writing excludedRepoNames, so deliberate hiding is reachable from the CLI before registration as well as after sync", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.2"], "milestone": "M11", "notes": "Scan-level hiding lives in drift.config.ts excludedRepoNames (moved out of excluded.json when it was paired to scanRoot), which only a hand edit reaches today. Write it with the TypeScript-compiler splice the overlay verbs already use, since the config is a .ts module; the alternative is a gitignored JSON sidecar beside sources.local.json, which avoids writing config but splits the ignore list across two files. Offer the action from the same discovered-repo picker as drift register, so every discovered repo has two exits: register or ignore.", "assignee": "", "started": ""}, {"id": "11LC.7", "description": "drift card \u003cslug\u003e: render the fields the site's ProjectCard shows, resolved through the same manifest-plus-overlay merge as the site, so a synced-only project's derived card is visible before anyone authors it", "status": "todo", "display": "todo", "dependsOn": [], "milestone": "M11", "notes": "ProjectCard.svelte shows name, the role badge, tagline, blurb (expanded), the first four tags, the live link and the stage badge. Rendering those for a synced-only project needs the manifest-to-Project defaults merge in src/lib/data/defaults.ts, which is integration-layer code, so this verb is portfolio-shaped in the same way drift audit is (Bun's native ESM import of .ts) and its extraction shape is decided by the 10EX.1 spike; hence the soft edge. drift authored \u003cslug\u003e is not this view: it shows authored fields only and exits non-zero when no overlay exists, which is precisely the case scenario 4 needs to see. 7DR.2 later wraps this card in the full per-field provenance view.", "assignee": "", "started": ""}, {"id": "11LC.8", "description": "Edit every card-visible field from the CLI: extend author-edit to contribution role and note, highlights, released, retired, track and hideFromPlainIntro, with multi-line prose via gum write or $EDITOR and the redundancy guard applied on write", "status": "todo", "display": "todo", "dependsOn": ["5DR.24"], "milestone": "M11", "notes": "AUTHOR_EDITABLE_FIELDS (check-drift.js:3691) covers name, tagline, blurb, plainBlurb, description, kind and liveUrl. Card-visible fields with no CLI edit path today: contribution.role and contribution.note, highlights, released, retired, track and hideFromPlainIntro; tags and pin/hide already have drift tag and drift flag. Multi-line prose goes through gum write or $EDITOR on the single field, never a whole-file rewrite (docs/drift-authoring.md, \"What will overwrite me\"). Every write must run the same redundancy check data.test.ts applies, refusing an authored value that merely restates the inference, otherwise this verb becomes the fastest way to fail the test suite.", "assignee": "", "started": ""}, {"id": "11LC.9", "description": "Synced-only workbench: browse the projects that exist by sync alone, each with its derived card and four exits in place (author, approve, hide, leave)", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.4", "11LC.7", "11LC.11"], "milestone": "M11", "notes": "The synced-only queue is what scenario 4 calls projects that exist by direct sync alone. Each entry shows its derived card (11LC.7) and four exits in place: author (drift author), approve (drift approve, 11LC.11), hide (drift hide) or leave for later. Approved projects drop out of this queue and into the approved group of drift projects, so the queue is always exactly the unreviewed set.", "assignee": "", "started": ""}, {"id": "11LC.11", "description": "drift approve \u003cslug\u003e: record that a synced-only project has been checked and may stand on its derived defaults, so the projects list and workbench distinguish reviewed from unreviewed without requiring an overlay", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.1"], "milestone": "M11", "notes": "Approval is a verdict, not content, so it should not live in the overlay: an overlay's existence is what \"authored\" means, and a file holding only { slug, approved: true } would blur that line. Recommended home: a committed approved.json beside excluded.json, same shape ({ slugs: [] }), written by this verb alone under the write-isolation contract; hide and approve are then the two curatorial verdicts on a synced repo, stored symmetrically. Alternative considered: an approvals section in overrides.json, rejected because overrides pin metric values against a synced baseline and approval has neither. Approval carries no publication effect in this milestone: it changes state (synced-only becomes approved) and nothing on the site; the publishOnSync policy that would gate the registry on approved-or-authored is 7DR.10. Include the reverse (approve --revoke) and decide whether drift hide removes a standing approval; an author edit supersedes it naturally, since the slug becomes authored.", "assignee": "", "started": ""}, {"id": "11LC.12", "description": "Split the report's \"Repos without local paths\" into two headings: configured path broken (moved or deleted, actionable) and no path on this machine (offloaded, quiet)", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.1"], "milestone": "M11", "notes": "Today both cases land in missing with one reason string (resolveProjectSources, check-drift.js:1778-1795; computeDrift's missing branch at 1892). Real case from the report of 22 September 2026: fac-cra and iris had moved from Code/apps to Code/client, sparker had been deleted locally while its remote remains owned, and all three read identically. The rule needing no new file: a path present in sources.local.json but not found on disk is broken and actionable (moved or deleted); a slug absent from sources.local.json altogether is deliberately not on this machine, listed once under a quiet heading and never counted by --check (missing is already excluded from the gate, applyCheckExit at check-drift.js:3197). The manifest entry and the site are untouched in both cases: last-synced fingerprints stand until a machine that has the repo syncs again.", "assignee": "", "started": ""}, {"id": "11LC.13", "description": "drift relocate and drift unregister: repoint a moved repo's path (with a move hint pairing a broken path to a discovered repo of the same folder name or remote) and drop a deleted repo's path so it reads as not on this machine", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.2", "11LC.12"], "milestone": "M11", "notes": "The move hint is the rename/move correlation the original improvement plan listed under Phase 4 (docs/drift-improvement-plan.md): a broken path whose folder name, or whose remote URL when the discovered repo's origin can be read, matches a discovered repo is offered as \"fac-cra looks like it moved to Code/client/fac-cra, relink?\". relocate rewrites the one path in sources.local.json; unregister removes it, which by 11LC.12's rule turns the nag into a quiet \"not on this machine\" line while sources.json and the site keep the last sync. Both write sources.local.json only, the file drift register (11LC.2) already owns, so they extend that verb's write-isolation entry rather than adding one. Companion sources in source-topology.json need the same two operations.", "assignee": "", "started": ""}, {"id": "11LC.14", "description": "Remote reachability: drift enrich records whether each slug's urlRepo is still reachable, and its visibility, in the enriched section, so a repo whose remote access was lost is surfaced in the projects list and the site can stop linking to it", "status": "todo", "display": "todo", "dependsOn": ["5DR.22"], "milestone": "M11", "notes": "fac-cra: the local moved and access to the remote is gone, yet sources.json still carries its urlRepo (read from the local's origin at sync time, which sync will keep re-reading) and the site still links to it. Sync stays offline by contract, so the check belongs in drift enrich, which already calls gh repo view per slug (5DR.22): a 404 or 403 becomes reachable: false in the enriched section beside archived and homepageUrl (schema extension in scripts/sources.schema.json), and visibility (public or private) is worth recording in the same call since a private repo is equally unlinkable for visitors. Site consumer: suppress or annotate the repo link when reachable is false; a small integration-layer change that can ship with this task or as its follow-up. Coordinate with 5DR.28, which parallelises the same gh calls, so the two do not rewrite fetchGhRepoView at once.", "assignee": "", "started": ""}, {"id": "11LC.10", "description": "Scenario acceptance: scripted end-to-end walkthrough of the five lifecycle scenarios against a fixture scanRoot, plus the CLI, authoring and boundary docs brought into line", "status": "blocked", "display": "blocked", "dependsOn": ["11LC.5", "11LC.6", "11LC.8", "11LC.9", "11LC.13", "11LC.14"], "milestone": "M11", "notes": "Milestone sink. A scripted walkthrough against a temporary scanRoot fixture (two fresh repos, one companion, one to ignore, one that moves mid-walkthrough and one deleted locally) driving drift register, drift sync, drift projects, drift card, drift author \u003cfield\u003e, drift approve, drift hide, drift relocate and drift unregister in sequence, asserting the lifecycle state after each step and that the admitted slug reaches the registry. Docs to bring into line: docs/drift/02-cli.md (bootstrap steps 2 and 3 and the verb tables), docs/drift-authoring.md (\"Adding a new project, end to end\", and \"Four ways to hide something\" gaining the scan-level ignore and approval) and the write-isolation contract in docs/drift-boundary.md.", "assignee": "", "started": ""}], "ready": {"phase": "MVP", "candidates": [{"id": "11LC.1", "description": "Project lifecycle resolver: classify every repo Drift can see into exactly one state (discovered, ignored, registered, companion, synced-only, approved, authored, hidden) from the scan, sources.local.json, source-topology.json, sources.json, approved.json, projects/ and excluded.json", "milestone": "M11", "milestoneName": "Drift: Project Lifecycle", "milestoneDonePct": 0, "directDependents": 4, "transitiveUnblocks": 12, "isMilestoneSink": false, "notes": "Today the CLI answers \"what state is this repo in\" from six places that nothing reconciles: the scan under scanRoot (check-drift.js:2069-2105), sources.local.json, source-topology.json, sources.json, the projects/ directory and excluded.json; approved.json (11LC.11) makes seven. Precedence to settle and test: hidden beats authored (kamino has an overlay and sits in excluded.json); authored beats approved (an overlay supersedes a standing approval); a companion source is never a project (beacons-frontend-v2, s": "blocked", "display": "blocked"}, "11LC.4": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.5": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.6": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.7": {"kind": "task", "status": "todo", "display": "todo"}, "11LC.8": {"kind": "task", "status": "todo", "display": "todo"}, "11LC.9": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.11": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.12": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.13": {"kind": "task", "status": "blocked", "display": "blocked"}, "11LC.14": {"kind": "task", "status": "todo", "display": "todo"}, "11LC.10": {"kind": "task", "status": "blocked", "display": "blocked"}, "M1": {"kind": "milestone"}, "M2": {"kind": "milestone"}, "M3": {"kind": "milestone"}, "M4": {"kind": "milestone"}, "M5": {"kind": "milestone"}, "M6": {"kind": "milestone"}, "M7": {"kind": "milestone"}, "M8": {"kind": "milestone"}, "M9": {"kind": "milestone"}, "M10": {"kind": "milestone"}, "M11": {"kind": "milestone"}}}</script>
<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const DATA = JSON.parse(document.getElementById("roadmap-data").textContent);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
	c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

document.getElementById("pageTitle").textContent =
	DATA.project ? `${DATA.project}: ${DATA.phase}` : DATA.phase;
document.getElementById("meta").textContent =
	`generated ${DATA.generated} · source .claude/roadmaps.json`;

/* Validation banner (empty when clean) */
if (DATA.validation && DATA.validation.length) {
	document.getElementById("validation").innerHTML =
		`<div class="validation"><strong>${DATA.validation.length} validation ` +
		`discrepancy(ies):</strong> the numbers below reflect the file as-is.` +
		`<ul>${DATA.validation.map(v => `<li>${esc(v)}</li>`).join("")}</ul></div>`;
}

/* Milestone-level state (distinct from task status): computed server-side by
   roadmap.py's milestone_state() and carried as m.state, so the artefact
   never re-derives it and cannot disagree with the CLI's own stats/render
   paths. States: deferred, done, inProgress, todo, blocked, paused. The
   same map colours dependency chips by a task's display status, which adds
   in_progress (a claimed task) and out_of_scope. */
const STATE_VAR = {
	deferred: "deferred", done: "done", inProgress: "in-progress",
	todo: "todo", blocked: "blocked", paused: "paused",
	in_progress: "in-progress", out_of_scope: "out-of-scope",
};
const STATE_RANK = { inProgress: 0, todo: 1, done: 2, blocked: 3, paused: 4, deferred: 5 };
/* Overview cards and Milestones details share this one ordering, computed
   once here rather than in Python, since build_stats' milestones[] stays in
   roadmap order for other consumers (_human_stats, next-task-*). */
const sortedMilestones = [...DATA.stats.milestones].sort((a, b) =>
	(STATE_RANK[a.state] - STATE_RANK[b.state])
	|| (b.donePct - a.donePct)
	|| a.name.localeCompare(b.name));

/* A dev-chip helper: colour + label for an assignee, empty string when unset. */
const devChip = assignee => {
	const varName = DATA.devColours?.[assignee];
	if (!assignee || !varName) return "";
	return `<span class="chip" style="--chip-fg:var(--color-dev-${varName});--chip-bg:var(--color-dev-${varName}-bg)">${esc(assignee)}</span>`;
};
/* A dependency-id chip: colour by what the id resolves to (task status,
   milestone sky, or gate yellow), using the server-computed depKinds map
   so the artefact never re-derives the graph. */
const depChip = id => {
	const k = DATA.depKinds?.[id];
	if (!k) return `<span class="chip">${esc(id)}</span>`;
	const varName = k.kind === "task" ? STATE_VAR[k.display ?? k.status] ?? "todo"
		: k.kind === "milestone" ? "milestone" : "gate";
	return `<span class="chip" style="--chip-fg:var(--color-${varName});--chip-bg:var(--color-${varName}-bg)">${esc(id)}</span>`;
};

/* Section 1 — Overview */
const st = DATA.stats;
document.getElementById("hero").innerHTML =
	`${st.byStatus.done}/${st.total} tasks<small>${st.donePct}% complete</small>` +
	`<small>${st.milestonesDone}/${st.milestonesTotal} milestones</small>`;

document.getElementById("milestone-cards").innerHTML = sortedMilestones.map(m => `
	<div class="card mini" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<h3>${esc(m.id)}: ${esc(m.name)}</h3>
		<span class="count">${m.done}/${m.total} done · ${m.donePct}%</span>
		<div class="progress-bar"><div class="progress-fill"
			style="width:${m.donePct}%;background:var(--color-${STATE_VAR[m.state]})"></div></div>
	</div>`).join("");

/* Section 2 — Milestones. Groups lead with actionable work; milestones
   themselves follow the same order as the Overview cards above (A3), so a
   reader scanning top-to-bottom sees the same priority twice, not two
   different orderings of the same data. */
const GROUPS = [
	["in_progress", "▸ In Progress",  "in-progress"],
	["todo",        "○ To Do",        "todo"],
	["blocked",     "✗ Blocked",      "blocked"],
	["paused",      "⏸ Paused",       "paused"],
	["deferred",    "⤓ Deferred",     "deferred"],
	["done",        "✓ Done",         "done"],
	["out_of_scope","⊘ Out of Scope", "out-of-scope"],
];
const readyIds = new Set(DATA.ready.candidates.map(c => c.id));
const tasksByMilestone = {};
for (const t of DATA.tasks) (tasksByMilestone[t.milestone] ??= []).push(t);

document.getElementById("milestone-details").innerHTML = sortedMilestones.map(m => {
	const tasks = tasksByMilestone[m.id] || [];
	const groups = GROUPS.map(([status, label, varName]) => {
		const members = tasks.filter(t => (t.display ?? t.status) === status);
		if (!members.length) return "";
		const items = members.map(t => {
			const deps = (t.dependsOn && t.dependsOn.length)
				? `<span class="deps">${t.dependsOn.map(depChip).join("")}</span>` : "";
			return `<li class="${status === "out_of_scope" ? "oos" : ""}">
				<span class="tid">${esc(t.id)}</span>${devChip(t.assignee)}
				<span class="tasktext">${esc(t.description)}</span>${deps}</li>`;
		}).join("");
		return `<div class="group">
			<h4 style="color:var(--color-${varName})">${label}</h4><ul>${items}</ul></div>`;
	}).join("");
	// All milestones render collapsed; the reader chooses what to expand
	return `<details class="milestone" style="--m-colour:var(--color-${STATE_VAR[m.state]})">
		<summary><span class="mid">${esc(m.id)}</span>${esc(m.name)}
			<span class="count">${m.done}/${m.total}</span></summary>
		<div class="body">${groups || "<p class='depnote'>No tasks.</p>"}</div>
	</details>`;
}).join("");

/* Section 3 — Dependency graph */
/* ELK lays out this dense a graph with far fewer crossings than the default
   dagre engine; if its module fails to load, dagre still renders. */
let layout = "dagre";
try {
	const elkLayouts = (await import("https://cdn.jsdelivr.net/npm/@mermaid-js/layout-elk@0/dist/mermaid-layout-elk.esm.min.mjs")).default;
	mermaid.registerLayoutLoaders(elkLayouts);
	layout = "elk";
} catch { /* CDN unreachable — fall back */ }
/* Mermaid 11's classDef parser rejects var(--x), so the semantic variables
   are resolved to concrete colours before rendering, and the graph re-renders
   when the colour scheme flips so it keeps tracking the page theme. A render
   failure is contained to the diagram shell — the sections after it must
   still populate.

   Node fills/strokes come entirely from the classDefs above (resolved via
   the var() replace below), but mermaid's "base" theme still supplies its
   own defaults for everything a classDef doesn't touch — edge stroke,
   arrowhead fill, edge-label background. Those defaults assume a white
   canvas, so left alone they render near-black on the dark surface. Fixing
   that means passing --diagram-line/--diagram-edge-label-bg/--diagram-text
   through as themeVariables — and critically, mermaid.initialize() must be
   called again on every render (not once at module load) reading the
   *currently resolved* values, or a colour-scheme flip silently keeps the
   load-time edge colours and the explicit data-theme toggle below never
   takes effect at all (matchMedia doesn't fire for it). */
const wrap = document.getElementById("wrap");
const shell = document.getElementById("shell");
const diagram = document.getElementById("diagram");
let svgEl = null;
let scale = 1, tx = 0, ty = 0;
const apply = () => { if (svgEl) svgEl.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
const renderGraph = async () => {
	const rootStyle = getComputedStyle(document.documentElement);
	const cssVar = name => rootStyle.getPropertyValue(name).trim() || "#888888";
	mermaid.initialize({
		startOnLoad: false,
		theme: "base",
		layout,
		themeVariables: {
			fontSize: "16px",
			fontFamily: '"IBM Plex Mono", monospace',
			background: cssVar("--surface"),
			lineColor: cssVar("--diagram-line"),
			edgeLabelBackground: cssVar("--diagram-edge-label-bg"),
			textColor: cssVar("--diagram-text"),
		},
	});
	const src = DATA.mermaid.replace(/var\((--[\w-]+)\)/g, (_, name) => cssVar(name));
	try {
		const { svg } = await mermaid.render("roadmap-graph", src);
		diagram.innerHTML = svg;
	} catch (err) {
		document.getElementById("droadmap-graph")?.remove();
		diagram.innerHTML = `<p class="depnote">Dependency graph failed to render: ${esc(String(err))}</p>`;
		return;
	}
	svgEl = wrap.querySelector("svg");
	svgEl.addEventListener("dblclick", () => shell.classList.toggle("expanded"));
	apply();
};
await renderGraph();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderGraph);
/* Covers the explicit data-theme toggle (no UI ships today, but the
   three-state contract says a future one must just work — see the CSS
   comment above :root[data-theme="dark"]). matchMedia only fires for the OS
   preference, so the attribute needs its own watcher. */
new MutationObserver(renderGraph).observe(document.documentElement,
	{ attributes: true, attributeFilter: ["data-theme"] });

/* Zoom/pan: buttons, ctrl+wheel, drag; expand toggles a fixed overlay */
const zoom = f => { scale = Math.min(4, Math.max(0.25, scale * f)); apply(); };
shell.querySelector(".diagram-toolbar").addEventListener("click", e => {
	const act = e.target.dataset.act;
	if (act === "in") zoom(1.25);
	else if (act === "out") zoom(0.8);
	else if (act === "reset") { scale = 1; tx = ty = 0; apply(); }
	else if (act === "expand") shell.classList.toggle("expanded");
});
wrap.addEventListener("wheel", e => {
	if (!e.ctrlKey && !e.metaKey) return;
	e.preventDefault();
	zoom(e.deltaY < 0 ? 1.1 : 0.9);
}, { passive: false });
let drag = null;
wrap.addEventListener("pointerdown", e => { drag = { x: e.clientX - tx, y: e.clientY - ty }; wrap.setPointerCapture(e.pointerId); });
wrap.addEventListener("pointermove", e => { if (drag) { tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply(); } });
wrap.addEventListener("pointerup", () => { drag = null; });

/* Section 4 — Next Up (pre-vetted by roadmap.py ready). Same chip structure
   as the Milestones section (A5); grouped by dev only when the READY SET
   (the candidates actually shown here, not the whole phase) has more than
   one distinct assignee, so a solo project (or a phase where only one dev's
   work happens to be unblocked right now) stays flat rather than gaining a
   pointless single-group heading. */
const candidateLi = c => `
	<li>
		<span class="tid">${esc(c.id)}</span>${devChip(c.assignee)}
		<span class="tasktext">${esc(c.description)}</span>
		<span class="deps"><span class="chip" style="--chip-fg:var(--color-milestone);--chip-bg:var(--color-milestone-bg)">${esc(c.milestone)}: ${esc(c.milestoneName)}</span></span>
		<span class="signal">unblocks ${c.transitiveUnblocks}${c.isMilestoneSink ? " · completes milestone" : ""}</span>
	</li>`;
const readyAssignees = new Set(DATA.ready.candidates.map(c => c.assignee).filter(Boolean));
const readyHtml = !DATA.ready.candidates.length
	? "<li>No unblocked tasks: clear a blocker or a gate.</li>"
	: readyAssignees.size > 1
	? [...readyAssignees].sort().map(dev => `
		<li class="nextup-devgroup"><h4>${devChip(dev)}</h4>
			<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => c.assignee === dev).map(candidateLi).join("")}</ul>
		</li>`).join("") +
		(DATA.ready.candidates.some(c => !c.assignee)
			? `<li class="nextup-devgroup"><h4>Unassigned</h4>
				<ul style="list-style:none;margin:0;padding:0">${DATA.ready.candidates.filter(c => !c.assignee).map(candidateLi).join("")}</ul>
			</li>` : "")
	: DATA.ready.candidates.map(candidateLi).join("");
/* Claims in play lead, since someone is already on them; the ready set then
   gets its own heading so the two lists never read as one. A parked claim
   (paused/deferred wins over a claim) stays in its Milestones group. */
const claimLi = c => `
	<li>
		<span class="tid">${esc(c.id)}</span>${devChip(c.assignee)}
		<span class="tasktext">${esc(c.description)}</span>
		<span class="signal">since ${esc(c.started)}${c.status === "todo" ? "" : ` · ${esc(c.status)}`}</span>
	</li>`;
const claimed = (DATA.ready.claimed ?? []).filter(c => c.display === "in_progress");
document.getElementById("ready").innerHTML = claimed.length
	? `<li class="nextup-devgroup"><h4 style="color:var(--color-in-progress)">▸ In progress</h4>
		<ul style="list-style:none;margin:0;padding:0">${claimed.map(claimLi).join("")}</ul></li>
		<li class="nextup-devgroup"><h4>Ready</h4>
		<ul style="list-style:none;margin:0;padding:0">${readyHtml}</ul></li>`
	: readyHtml;

/* Nav highlight */
const links = [...document.querySelectorAll("nav a")];
const highlight = new IntersectionObserver(entries => {
	for (const en of entries) if (en.isIntersecting) {
		links.forEach(a => a.classList.toggle("active", a.hash === "#" + en.target.id));
	}
}, { rootMargin: "-30% 0px -60% 0px" });
links.forEach(a => highlight.observe(document.querySelector(a.hash)));
</script>
</body>
</html>
